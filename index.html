<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGE Numbers</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            padding: 20px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #E5A93D;
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
        }

        .header h2 {
            margin: 5px 0 0 0;
            font-size: 32px;
            font-weight: 900;
        }

        .card {
            background: linear-gradient(180deg, #1E1E1E 0%, #0A0A0A 100%);
            border: 1px solid #333;
            border-radius: 20px;
            width: 320px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .balance {
            color: #E5A93D;
            font-weight: bold;
        }

        .rarity-bar {
            background-color: #1A1A1A;
            border: 1px solid #333;
            border-radius: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .rarity-name {
            color: #E5A93D;
            font-weight: bold;
            text-transform: uppercase;
        }

        .rarity-price {
            color: #E5A93D;
            font-weight: bold;
        }

        .number-display {
            background: #ccc;
            color: #000;
            font-size: 22px;
            font-weight: 900;
            padding: 10px 15px;
            border-radius: 5px;
            border: 2px solid #fff;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: 'Courier New', Courier, monospace;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .details {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 35px;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background-color: #E5A93D;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        button:hover {
            background-color: #FFC55C;
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        select {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }

        #tap-btn {
            background-color: #d32f2f;
            color: #fff;
            display: none;
        }

        #tap-btn:hover {
            background-color: #f44336;
        }

        #case-btn {
            background-color: #9b59b6;
            color: #fff;
            display: none;
        }

        #case-btn:hover {
            background-color: #8e44ad;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        #inv-btn {
            background-color: #3498db;
            color: #fff;
            flex: 1;
        }

        #inv-btn:hover {
            background-color: #2980b9;
        }

        #ach-btn {
            background-color: #e67e22;
            color: #fff;
            flex: 1;
        }

        #ach-btn:hover {
            background-color: #d35400;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1E1E1E;
            border: 1px solid #E5A93D;
            padding: 20px;
            border-radius: 15px;
            width: 320px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(229, 169, 61, 0.2);
            box-sizing: border-box;
        }

        .modal-content h3 {
            margin-top: 0;
            text-align: center;
            color: #E5A93D;
            text-transform: uppercase;
        }

        .close {
            color: #888;
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            color: #fff;
        }

        .inv-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2A2A2A;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .inv-item span {
            font-weight: bold;
        }

        .sell-btn {
            background-color: #2ecc71;
            color: #000;
            padding: 5px 10px;
            font-size: 10px;
        }

        .sell-btn:hover {
            background-color: #27ae60;
        }

        .empty-inv {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .ach-counter {
            text-align: center;
            color: #E5A93D;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .ach-progress {
            height: 6px;
            background-color: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .ach-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #E5A93D, #FFC55C);
            transition: width 0.3s;
        }

        .ach-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #2A2A2A;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .ach-item.locked {
            opacity: 0.4;
            background-color: #1A1A1A;
        }

        .ach-item.unlocked {
            border-left: 3px solid #2ecc71;
        }

        .ach-icon {
            font-size: 22px;
            min-width: 28px;
            text-align: center;
        }

        .ach-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .ach-name {
            font-weight: bold;
            color: #E5A93D;
        }

        .ach-item.locked .ach-name {
            color: #888;
        }

        .ach-desc {
            color: #888;
            font-size: 10px;
            margin-top: 2px;
        }

        .ach-check {
            font-size: 16px;
            color: #2ecc71;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        .toast {
            background: linear-gradient(135deg, #E5A93D, #FFC55C);
            color: #000;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            animation: toastIn 0.3s ease;
            max-width: 280px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ЛОВИ</h1>
        <h2>НОМЕРА</h2>
    </div>

    <div class="card">
        <div class="card-top">
            <span>===</span>
            <span class="balance">БАЛАНС: <span id="balance">10 000</span> ₽</span>
        </div>

        <div class="rarity-bar">
            <span class="rarity-name" id="rarity">Обычный</span>
            <span class="rarity-price" id="price">1 000 ₽</span>
        </div>

        <div class="number-display" id="number">+7 (999) 000-00-00</div>

        <div class="details" id="details">
            Жми крутить, чё встал. Спин - 3000 ₽
        </div>

        <div class="controls">
            <select id="region-select">
                <option value="+7">Россия (+7)</option>
                <option value="+1">США/Канада (+1)</option>
                <option value="+44">Великобритания (+44)</option>
                <option value="+49">Германия (+49)</option>
                <option value="+33">Франция (+33)</option>
                <option value="+81">Япония (+81)</option>
            </select>
            <button id="spin-btn">Крутить (-3000 ₽)</button>
            <button id="tap-btn">ТАПАТЬ (+10 ₽)</button>
            <button id="case-btn">ОТКРЫТЬ КЕЙС (-1 000 000 ₽)</button>
            <div class="btn-row">
                <button id="inv-btn">🎒 ИНВ</button>
                <button id="ach-btn">🏆 АЧИВКИ</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно инвентаря -->
    <div id="inv-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-inv">&times;</span>
            <h3>Инвентарь</h3>
            <div id="inv-list">
                <p class="empty-inv">Тут пусто, хули ты хотел</p>
            </div>
        </div>
    </div>

    <!-- Модальное окно достижений -->
    <div id="ach-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-ach">&times;</span>
            <h3>Достижения</h3>
            <div class="ach-counter" id="ach-counter">0 / 100</div>
            <div class="ach-progress">
                <div class="ach-progress-bar" id="ach-progress-bar" style="width: 0%"></div>
            </div>
            <div id="ach-list"></div>
        </div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // === DOM элементы ===
        const spinBtn = document.getElementById('spin-btn');
        const tapBtn = document.getElementById('tap-btn');
        const caseBtn = document.getElementById('case-btn');
        const invBtn = document.getElementById('inv-btn');
        const achBtn = document.getElementById('ach-btn');
        const numberDisplay = document.getElementById('number');
        const rarityDisplay = document.getElementById('rarity');
        const priceDisplay = document.getElementById('price');
        const detailsDisplay = document.getElementById('details');
        const balanceDisplay = document.getElementById('balance');
        const regionSelect = document.getElementById('region-select');

        const invModal = document.getElementById('inv-modal');
        const closeInv = document.getElementById('close-inv');
        const invList = document.getElementById('inv-list');

        const achModal = document.getElementById('ach-modal');
        const closeAch = document.getElementById('close-ach');
        const achList = document.getElementById('ach-list');
        const achCounter = document.getElementById('ach-counter');
        const achProgressBar = document.getElementById('ach-progress-bar');

        const toastContainer = document.getElementById('toast-container');

        // === Константы ===
        const SPIN_COST = 3000;
        const CASE_COST = 1000000;

        const itemNames = {
            mansion: "Особняк",
            heli: "Вертолет",
            house: "Маленький дом",
            car: "Спорткар",
            shovel: "Лопата"
        };

        const itemIcons = {
            mansion: "🏰",
            heli: "🚁",
            house: "🏠",
            car: "🏎️",
            shovel: "🪏"
        };

        const itemPrices = {
            mansion: 400000000,
            heli: 20000000,
            house: 10000000,
            car: 5000000,
            shovel: 3000
        };

        // === Состояние ===
        let balance = 10000;
        let isSpinning = false;
        let inventory = { mansion: 0, heli: 0, house: 0, car: 0, shovel: 0 };
        let stats = defaultStats();
        let unlockedAchievements = {};
        let initialLoad = true;

        function defaultStats() {
            return {
                totalSpins: 0,
                totalCases: 0,
                totalEarned: 10000,
                maxBalance: 10000,
                itemsEarned: { mansion: 0, heli: 0, house: 0, car: 0, shovel: 0 },
                soldByType: { mansion: 0, heli: 0, house: 0, car: 0, shovel: 0 },
                itemsSold: 0,
                legendarySpins: 0,
                mythicalSpins: 0,
                epicSpins: 0,
                goldSpins: 0,
                caseSpending: 0
            };
        }

        function inventorySize() {
            let total = 0;
            for (let k in inventory) total += inventory[k];
            return total;
        }

        // === Список 100 достижений ===
        const achievementsList = [];
        function addAch(id, name, desc, icon, check) {
            achievementsList.push({ id, name, desc, icon, check });
        }

        // Спины (10)
        [1, 5, 10, 25, 50, 100, 250, 500, 1000, 5000].forEach(n => {
            const name = n === 1 ? 'Первый спин!' : `Спинов: ${n}`;
            addAch(`spin_${n}`, name, `Сделайте ${n} спинов`, '🎰', () => stats.totalSpins >= n);
        });

        // Кейсы (9)
        [1, 2, 5, 10, 20, 50, 100, 200, 500].forEach(n => {
            const name = n === 1 ? 'Первый кейс!' : `Кейсов: ${n}`;
            addAch(`case_${n}`, name, `Откройте ${n} кейсов`, '📦', () => stats.totalCases >= n);
        });

        // Баланс (19)
        [
            [10000, '10 000 ₽ на счету'],
            [25000, '25 000 ₽ на счету'],
            [50000, 'Первые 50 000 ₽'],
            [100000, '100 000 ₽ на счету'],
            [250000, '250 000 ₽ на счету'],
            [500000, 'Полмиллиона'],
            [1000000, 'Миллионер!'],
            [2000000, '2 миллиона'],
            [5000000, '5 миллионов'],
            [10000000, '10 миллионов'],
            [25000000, '25 миллионов'],
            [50000000, '50 миллионов'],
            [100000000, '100 миллионов'],
            [250000000, '250 миллионов'],
            [500000000, 'Полмиллиарда'],
            [1000000000, 'Миллиардер!'],
            [5000000000, '5 миллиардов'],
            [10000000000, '10 миллиардов'],
            [50000000000, '50 миллиардов']
        ].forEach(([val, name]) => {
            addAch(`bal_${val}`, name, `Достигните ${val.toLocaleString('ru-RU')} ₽`, '💰', () => stats.maxBalance >= val);
        });

        // Заработано всего (7)
        [50000, 100000, 500000, 1000000, 10000000, 100000000, 1000000000].forEach(n => {
            addAch(`earn_${n}`, `Заработано ${n.toLocaleString('ru-RU')} ₽`, `Заработайте ${n.toLocaleString('ru-RU')} ₽ за всё время`, '💵', () => stats.totalEarned >= n);
        });

        // Предметы (32)
        const itemCategories = [
            { key: 'mansion', icon: '🏰', name: 'Особняк', counts: [1, 2, 5, 10, 25, 50], first: 'УРА, ТЫ ВЫБИЛ ОСОБНЯК!' },
            { key: 'heli', icon: '🚁', name: 'Вертолет', counts: [1, 2, 5, 10, 25, 50], first: 'Первый вертолет!' },
            { key: 'house', icon: '🏠', name: 'Дом', counts: [1, 2, 5, 10, 25, 50], first: 'Первый домик!' },
            { key: 'car', icon: '🏎️', name: 'Спорткар', counts: [1, 2, 5, 10, 25, 50], first: 'Первая тачка!' },
            { key: 'shovel', icon: '🪏', name: 'Лопата', counts: [1, 5, 10, 25, 50, 100, 250, 500], first: 'Хоть лопата!' }
        ];
        itemCategories.forEach(cat => {
            cat.counts.forEach(n => {
                const name = n === 1 ? cat.first : `${cat.name} x${n}`;
                addAch(`${cat.key}_${n}`, name, `Выбейте ${n} шт. (${cat.name})`, cat.icon, () => stats.itemsEarned[cat.key] >= n);
            });
        });

        // Продано всего (6)
        [1, 5, 10, 25, 50, 100].forEach(n => {
            const name = n === 1 ? 'Первая продажа!' : `Продано ${n} предметов`;
            addAch(`sold_${n}`, name, `Продайте ${n} предметов`, '💸', () => stats.itemsSold >= n);
        });

        // Продажа конкретных предметов (5)
        itemCategories.forEach(cat => {
            addAch(`sell_${cat.key}`, `Продал ${cat.name}`, `Продайте ${cat.name.toLowerCase()}`, cat.icon, () => stats.soldByType[cat.key] >= 1);
        });

        // Редкость номеров (4)
        addAch('legend_1', 'Легендарный номер!', 'Выбейте легендарный номер', '🌟', () => stats.legendarySpins >= 1);
        addAch('myth_1', 'Мифический номер!', 'Выбейте мифический номер', '🔮', () => stats.mythicalSpins >= 1);
        addAch('epic_1', 'Эпический номер!', 'Выбейте эпический номер', '💎', () => stats.epicSpins >= 1);
        addAch('gold_1', 'Золотой номер!', 'Выбейте номер с 0000', '🥇', () => stats.goldSpins >= 1);

        // Все предметы (1)
        addAch('all_items', 'Коллекционер', 'Соберите все виды предметов (хотя бы по 1)', '🏆', () => {
            return stats.itemsEarned.mansion >= 1 && stats.itemsEarned.heli >= 1 &&
                   stats.itemsEarned.house >= 1 && stats.itemsEarned.car >= 1 &&
                   stats.itemsEarned.shovel >= 1;
        });

        // Размер инвентаря (4)
        [10, 25, 50, 100].forEach(n => {
            addAch(`inv_${n}`, `Инвентарь: ${n}`, `Держите ${n} предметов в инвентаре одновременно`, '🎒', () => inventorySize() >= n);
        });

        // Траты на кейсы (3)
        [1000000, 10000000, 100000000].forEach(n => {
            addAch(`case_spend_${n}`, `Потрачено на кейсы: ${n.toLocaleString('ru-RU')} ₽`, `Потратьте ${n.toLocaleString('ru-RU')} ₽ на кейсы`, '💳', () => stats.caseSpending >= n);
        });

        // === Сохранение / Загрузка ===
        function saveGame() {
            const data = {
                balance: balance,
                inventory: inventory,
                stats: stats,
                unlockedAchievements: unlockedAchievements
            };
            try {
                localStorage.setItem('rageNumbersSave', JSON.stringify(data));
            } catch (e) {}
        }

        function loadGame() {
            const saved = localStorage.getItem('rageNumbersSave');
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                if (typeof data.balance === 'number') balance = data.balance;
                if (data.inventory) inventory = Object.assign({ mansion: 0, heli: 0, house: 0, car: 0, shovel: 0 }, data.inventory);
                if (data.stats) {
                    stats = Object.assign(defaultStats(), data.stats);
                    stats.itemsEarned = Object.assign({ mansion: 0, heli: 0, house: 0, car: 0, shovel: 0 }, data.stats.itemsEarned || {});
                    stats.soldByType = Object.assign({ mansion: 0, heli: 0, house: 0, car: 0, shovel: 0 }, data.stats.soldByType || {});
                }
                if (data.unlockedAchievements) unlockedAchievements = data.unlockedAchievements;
            } catch (e) {}
        }

        // === UI обновления ===
        function updateBalance() {
            if (balance > stats.maxBalance) stats.maxBalance = balance;
            balanceDisplay.innerText = balance.toLocaleString('ru-RU');

            if (balance < SPIN_COST) {
                spinBtn.style.display = 'none';
                tapBtn.style.display = 'block';
            } else {
                spinBtn.style.display = 'block';
                tapBtn.style.display = 'none';
            }

            if (balance >= CASE_COST) {
                caseBtn.style.display = 'block';
            } else {
                caseBtn.style.display = 'none';
            }
            saveGame();
        }

        function updateInventoryUI() {
            invList.innerHTML = "";
            let hasItems = false;

            for (let key in inventory) {
                if (inventory[key] > 0) {
                    hasItems = true;
                    let div = document.createElement('div');
                    div.className = 'inv-item';
                    div.innerHTML = `
                        <span>${itemIcons[key]} ${itemNames[key]} (x${inventory[key]})</span>
                        <button class="sell-btn" onclick="sellItem('${key}')">Продать ${itemPrices[key].toLocaleString('ru-RU')} ₽</button>
                    `;
                    invList.appendChild(div);
                }
            }

            if (!hasItems) {
                invList.innerHTML = '<p class="empty-inv">Тут пусто, хули ты хотел</p>';
            }
        }

        function updateAchievementsUI() {
            const unlockedCount = Object.keys(unlockedAchievements).filter(k => unlockedAchievements[k]).length;
            achCounter.innerText = `${unlockedCount} / ${achievementsList.length}`;
            achProgressBar.style.width = `${(unlockedCount / achievementsList.length) * 100}%`;

            achList.innerHTML = "";
            achievementsList.forEach(a => {
                const isUnlocked = !!unlockedAchievements[a.id];
                const div = document.createElement('div');
                div.className = 'ach-item ' + (isUnlocked ? 'unlocked' : 'locked');
                div.innerHTML = `
                    <div class="ach-icon">${a.icon}</div>
                    <div class="ach-info">
                        <div class="ach-name">${a.name}</div>
                        <div class="ach-desc">${a.desc}</div>
                    </div>
                    <div class="ach-check">${isUnlocked ? '✓' : ''}</div>
                `;
                achList.appendChild(div);
            });
        }

        function showToast(ach) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `${ach.icon} ДОСТИЖЕНИЕ!<br>${ach.name}`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function checkAchievements() {
            let newlyUnlocked = [];
            for (let a of achievementsList) {
                if (!unlockedAchievements[a.id] && a.check()) {
                    unlockedAchievements[a.id] = true;
                    newlyUnlocked.push(a);
                }
            }
            if (newlyUnlocked.length > 0) {
                saveGame();
                if (!initialLoad) {
                    newlyUnlocked.forEach((a, i) => setTimeout(() => showToast(a), i * 300));
                    updateAchievementsUI();
                }
            }
            initialLoad = false;
        }

        // === Логика рулетки ===
        function getRandomDigit() {
            return Math.floor(Math.random() * 10).toString();
        }

        function generateNumber() {
            let digits = "";
            for (let i = 0; i < 10; i++) digits += getRandomDigit();
            return digits;
        }

        function formatNumber(digits, region) {
            return `${region} (${digits.substring(0,3)}) ${digits.substring(3,6)}-${digits.substring(6,8)}-${digits.substring(8,10)}`;
        }

        function evaluateNumber(digits) {
            let counts = {};
            for (let i = 0; i < digits.length; i++) {
                let d = digits[i];
                counts[d] = (counts[d] || 0) + 1;
            }

            let maxFreq = 0;
            let mostFrequentDigit = null;
            for (let digit in counts) {
                if (counts[digit] > maxFreq) {
                    maxFreq = counts[digit];
                    mostFrequentDigit = digit;
                }
            }

            let rarity = "";
            let multiplier = 1;

            if (maxFreq >= 7) {
                rarity = "ЛЕГЕНДАРНЫЙ";
                multiplier = 500000;
            } else if (maxFreq === 6) {
                rarity = "МИФИЧЕСКИЙ";
                multiplier = 50000;
            } else if (maxFreq === 5) {
                rarity = "ЭПИЧЕСКИЙ";
                multiplier = 5000;
            } else if (maxFreq === 4) {
                rarity = "РЕДКИЙ";
                multiplier = 500;
            } else if (maxFreq === 3) {
                rarity = "НЕОБЫЧНЫЙ";
                multiplier = 50;
            } else {
                rarity = "ОБЫЧНЫЙ";
                multiplier = 1;
            }

            if (digits.substring(6) === "0000") {
                rarity = "ЛЕГЕНДАРНЫЙ (ЗОЛОТО)";
                multiplier = 1000000;
            }

            let finalPrice = 1000 * multiplier;
            let details = `Макс. совпадений: ${maxFreq} (цифра ${mostFrequentDigit})`;
            return { rarity, finalPrice, details };
        }

        function spin() {
            if (isSpinning) return;
            if (balance < SPIN_COST) return;

            balance -= SPIN_COST;
            stats.totalSpins++;
            updateBalance();

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "Крутим...";

            let spins = 0;
            const maxSpins = 20;
            const region = regionSelect.value;

            const interval = setInterval(() => {
                numberDisplay.innerText = formatNumber(generateNumber(), region);
                spins++;
                if (spins >= maxSpins) {
                    clearInterval(interval);
                    finishSpin(region);
                }
            }, 50);
        }

        function finishSpin(region) {
            const finalDigits = generateNumber();
            numberDisplay.innerText = formatNumber(finalDigits, region);

            const result = evaluateNumber(finalDigits);

            rarityDisplay.innerText = result.rarity;
            priceDisplay.innerText = result.finalPrice.toLocaleString('ru-RU') + ' ₽';
            detailsDisplay.innerText = result.details;

            if (result.rarity.includes("ЗОЛОТО")) stats.goldSpins++;
            else if (result.rarity === "ЛЕГЕНДАРНЫЙ") stats.legendarySpins++;
            else if (result.rarity === "МИФИЧЕСКИЙ") stats.mythicalSpins++;
            else if (result.rarity === "ЭПИЧЕСКИЙ") stats.epicSpins++;

            if (result.rarity.includes("ЗОЛОТО")) {
                rarityDisplay.style.color = "#FFD700";
            } else if (result.rarity === "ЛЕГЕНДАРНЫЙ") {
                rarityDisplay.style.color = "#FF0000";
            } else if (result.rarity === "МИФИЧЕСКИЙ") {
                rarityDisplay.style.color = "#FF00FF";
            } else if (result.rarity === "ЭПИЧЕСКИЙ") {
                rarityDisplay.style.color = "#9B59B6";
            } else {
                rarityDisplay.style.color = "#E5A93D";
            }

            balance += result.finalPrice;
            stats.totalEarned += result.finalPrice;
            updateBalance();

            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.innerText = `Крутить (-${SPIN_COST} ₽)`;

            checkAchievements();
        }

        function openCase() {
            if (balance < CASE_COST || isSpinning) return;

            balance -= CASE_COST;
            stats.totalCases++;
            stats.caseSpending += CASE_COST;
            updateBalance();

            const roll = Math.random() * 100;
            let reward = "";
            let isMoney = false;
            let rewardColor = "#E5A93D";
            let rewardIcon = "";

            if (roll < 5) {
                reward = "ОСОБНЯК";
                inventory.mansion++;
                stats.itemsEarned.mansion++;
                rewardIcon = itemIcons.mansion;
                rewardColor = "#FF0000";
            } else if (roll < 15) {
                reward = "ВЕРТОЛЕТ";
                inventory.heli++;
                stats.itemsEarned.heli++;
                rewardIcon = itemIcons.heli;
                rewardColor = "#FF00FF";
            } else if (roll < 25) {
                reward = "МАЛЕНЬКИЙ ДОМ";
                inventory.house++;
                stats.itemsEarned.house++;
                rewardIcon = itemIcons.house;
                rewardColor = "#9B59B6";
            } else if (roll < 40) {
                reward = "СПОРТКАР";
                inventory.car++;
                stats.itemsEarned.car++;
                rewardIcon = itemIcons.car;
                rewardColor = "#3498db";
            } else if (roll < 60) {
                reward = "500 000 ₽";
                isMoney = true;
                rewardIcon = "💵";
                rewardColor = "#2ecc71";
                balance += 500000;
                stats.totalEarned += 500000;
                updateBalance();
            } else {
                reward = "ЛОПАТА";
                inventory.shovel++;
                stats.itemsEarned.shovel++;
                rewardIcon = itemIcons.shovel;
                rewardColor = "#888";
            }

            updateInventoryUI();

            numberDisplay.innerText = `${rewardIcon} ${reward}`;
            numberDisplay.style.color = rewardColor;
            rarityDisplay.innerText = "КЕЙС ВСКРЫТ";
            rarityDisplay.style.color = "#fff";
            priceDisplay.innerText = isMoney ? "+500 000 ₽" : "В ИНВЕНТАРЕ";
            priceDisplay.style.color = rewardColor;
            detailsDisplay.innerText = isMoney ? "Бабок подвалило, иди ещё крути." : "Шмотка в рюкзаке, можешь продать.";

            setTimeout(() => {
                if (!isSpinning && balance >= SPIN_COST) {
                    numberDisplay.innerText = regionSelect.value + " (999) 000-00-00";
                    numberDisplay.style.color = "#000";
                    rarityDisplay.innerText = "Обычный";
                    rarityDisplay.style.color = "#E5A93D";
                    priceDisplay.innerText = "1 000 ₽";
                    priceDisplay.style.color = "#E5A93D";
                    detailsDisplay.innerText = "Жми крутить, чё встал. Спин - 3000 ₽";
                }
            }, 3000);

            checkAchievements();
        }

        window.sellItem = function(key) {
            if (inventory[key] > 0) {
                inventory[key]--;
                balance += itemPrices[key];
                stats.totalEarned += itemPrices[key];
                stats.itemsSold++;
                stats.soldByType[key]++;
                updateBalance();
                updateInventoryUI();
                detailsDisplay.innerText = `Продал ${itemIcons[key]} ${itemNames[key]} за ${itemPrices[key].toLocaleString('ru-RU')} ₽`;
                checkAchievements();
            }
        };

        // === Обработчики ===
        tapBtn.addEventListener('click', () => {
            balance += 10;
            stats.totalEarned += 10;
            updateBalance();
            if (balance >= SPIN_COST) detailsDisplay.innerText = "Бабки есть, хули тапаешь? Иди крути.";
            checkAchievements();
        });

        spinBtn.addEventListener('click', spin);
        caseBtn.addEventListener('click', openCase);

        invBtn.addEventListener('click', () => {
            updateInventoryUI();
            invModal.style.display = 'flex';
        });

        achBtn.addEventListener('click', () => {
            updateAchievementsUI();
            achModal.style.display = 'flex';
        });

        closeInv.addEventListener('click', () => invModal.style.display = 'none');
        closeAch.addEventListener('click', () => achModal.style.display = 'none');

        window.addEventListener('click', (e) => {
            if (e.target === invModal) invModal.style.display = 'none';
            if (e.target === achModal) achModal.style.display = 'none';
        });

        // === Запуск ===
        loadGame();
        updateBalance();
        updateInventoryUI();
        updateAchievementsUI();
        checkAchievements();
        initialLoad = false;
    </script>
</body>
</html>
